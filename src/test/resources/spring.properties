# Cada contexto de teste em cache segura um pool do Hikari aberto (10 conexões).
# Limitar o cache faz os contextos antigos fecharem e devolverem as conexões ao Postgres
# (o Postgres do CI aceita 100; com o cache padrão de 32 contextos, o CI estourou com "too many clients").
spring.test.context.cache.maxSize=4

spring.application.name=studymindredacao


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymind_redacao}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=studymind-redacao
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

app.fuso-horario=America/Sao_Paulo
app.limites.correcoes-diarias-free=${LIMITE_CORRECOES_DIARIAS:3}
# Teto de custo: soma de todos os usuários no dia
app.limites.correcoes-diarias-globais=${LIMITE_CORRECOES_GLOBAL:30}
# Transcricao de foto (#12): cota propria, separada das correcoes
app.limites.transcricoes-diarias-free=${LIMITE_TRANSCRICOES_DIARIAS:3}
app.limites.transcricoes-diarias-globais=${LIMITE_TRANSCRICOES_GLOBAL:30}
# Upload das fotos (#15): 5 MB por foto (= ImagemRedacao.TAMANHO_MAXIMO_BYTES), ate 2 fotos.
# max-request-size deve ser igual a LimiteTamanhoCorpoFilter.TAMANHO_MAXIMO_UPLOAD_BYTES.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# Cadastro fechado por padrão; só os e-mails da lista (separados por vírgula) conseguem criar conta
app.cadastro.aberto=${CADASTRO_ABERTO:false}
app.cadastro.emails-permitidos=${CADASTRO_EMAILS_PERMITIDOS:}

app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

# IP real atrás de proxy (rate limit): use native quando o deploy tiver proxy/HTTPS na frente
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Desligamento gracioso: no stop/deploy, espera as correções em andamento (até ~140 s) terminarem
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=150s


gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.modelo=${GEMINI_MODELO:gemini-3.5-flash-lite}
gemini.api-key=${GEMINI_API_KEY}
gemini.temperatura=0.3
gemini.timeout-segundos=${GEMINI_TIMEOUT_SEGUNDOS:60}

# Correção (#25). Sem GEMINI_MODELO_AVALIACAO, usa gemini.modelo.
# GEMINI_RACIOCINIO_AVALIACAO: minimal | low | medium | high. Padrão medium: calibrado em 15/10/2026
# (sem raciocínio o flash-lite variava até 80 pontos; high não trouxe ganho e é mais lento).
# Raciocínio aumenta a latência: revise GEMINI_TIMEOUT_SEGUNDOS e o timeout de desligamento acima.
gemini.avaliacao.modelo=${GEMINI_MODELO_AVALIACAO:${gemini.modelo}}
gemini.avaliacao.raciocinio=${GEMINI_RACIOCINIO_AVALIACAO:medium}

# Transcrição de redação manuscrita (#14). Temperatura 0: leitura literal, sem variação criativa.
# Sem GEMINI_MODELO_TRANSCRICAO, usa o mesmo modelo da correção.
gemini.transcricao.modelo=${GEMINI_MODELO_TRANSCRICAO:${gemini.modelo}}
gemini.transcricao.temperatura=0
# Chave de um projeto Google Cloud só da transcrição (isolamento de cota, custo e revogação); sem valor padrão de propósito
transcricao.gemini.api-key=${TRANSCRICAO_GEMINI_API_KEY}
transcricao.gemini.timeout-segundos=${TRANSCRICAO_GEMINI_TIMEOUT_SEGUNDOS:${gemini.timeout-segundos}}

# E-mail (verificação de conta). Desligado até a feature existir.
# Com EMAIL_HABILITADO=true, MAIL_USERNAME, MAIL_PASSWORD e APP_FRONTEND_URL passam a ser obrigatórios
# (o ValidadorConfiguracao derruba a subida se faltar algum).
app.email.habilitado=${EMAIL_HABILITADO:false}
app.email.remetente-nome=${MAIL_REMETENTE_NOME:Kelly Academy}
# Base dos links enviados por e-mail (ex.: https://app.kellyacademy.com.br), sem barra no final
app.frontend-url=${APP_FRONTEND_URL:}
# Validade do link de verificação (ISO-8601) e máximo de e-mails esperando envio; acima disso, descarta com log
app.email.verificacao-validade=PT24H
# Validade do link de "Esqueci minha senha" (curta de propósito: o link troca a senha)
app.email.redefinicao-validade=PT30M
app.email.fila-maxima=100
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.pagamento.habilitado=${PAGAMENTO_HABILITADO:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.preco-pro-mensal=${STRIPE_PRECO_PRO_MENSAL:kelly_pro_mensal}
stripe.preco-pro-anual=${STRIPE_PRECO_PRO_ANUAL:kelly_pro_anual}
stripe.logo-file=${STRIPE_LOGO_FILE:}

julia.gemini.api-key=${JULIA_GEMINI_API_KEY}
julia.gemini.modelo=${JULIA_GEMINI_MODELO:${gemini.modelo}}
julia.gemini.raciocinio=${JULIA_GEMINI_RACIOCINIO:low}
julia.gemini.temperatura=0.4
julia.gemini.max-tokens-saida=${JULIA_GEMINI_MAX_TOKENS:1024}
julia.gemini.timeout-segundos=${JULIA_GEMINI_TIMEOUT_SEGUNDOS:30}
julia.limites.por-conversa=${JULIA_LIMITE_CONVERSA:10}
julia.limites.diario=${JULIA_LIMITE_DIARIO:20}
julia.limites.global=${JULIA_LIMITE_GLOBAL:100}
julia.limites.tamanho-pergunta=500
julia.limites.historico=6
julia.limites.inatividade-horas=24
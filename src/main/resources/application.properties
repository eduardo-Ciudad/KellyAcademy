spring.application.name=studymindredacao


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studymind_redacao}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=studymind-redacao
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

app.fuso-horario=America/Sao_Paulo
app.limites.correcoes-diarias-free=${LIMITE_CORRECOES_DIARIAS:3}
# Teto de custo: soma de todos os usuários no dia
app.limites.correcoes-diarias-globais=${LIMITE_CORRECOES_GLOBAL:30}
# Transcricao de foto (#12): cota propria, separada das correcoes
app.limites.transcricoes-diarias-free=${LIMITE_TRANSCRICOES_DIARIAS:3}
app.limites.transcricoes-diarias-globais=${LIMITE_TRANSCRICOES_GLOBAL:30}
# Upload das fotos (#15): 5 MB por foto (= ImagemRedacao.TAMANHO_MAXIMO_BYTES), ate 2 fotos.
# max-request-size deve ser igual a LimiteTamanhoCorpoFilter.TAMANHO_MAXIMO_UPLOAD_BYTES.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB

# Cadastro fechado por padrão; só os e-mails da lista (separados por vírgula) conseguem criar conta
app.cadastro.aberto=${CADASTRO_ABERTO:false}
app.cadastro.emails-permitidos=${CADASTRO_EMAILS_PERMITIDOS:}

app.cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173}

# IP real atrás de proxy (rate limit): use native quando o deploy tiver proxy/HTTPS na frente
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Desligamento gracioso: no stop/deploy, espera as correções em andamento (até ~140 s) terminarem
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=150s


gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.modelo=gemini-3.5-flash-lite
gemini.api-key=${GEMINI_API_KEY}
gemini.temperatura=0.3
gemini.timeout-segundos=60

# Transcrição de redação manuscrita (#14). Temperatura 0: leitura literal, sem variação criativa.
# Sem GEMINI_MODELO_TRANSCRICAO, usa o mesmo modelo da correção.
gemini.transcricao.modelo=${GEMINI_MODELO_TRANSCRICAO:${gemini.modelo}}
gemini.transcricao.temperatura=0

# E-mail (verificação de conta). Desligado até a feature existir.
# Com EMAIL_HABILITADO=true, MAIL_USERNAME, MAIL_PASSWORD e APP_FRONTEND_URL passam a ser obrigatórios
# (o ValidadorConfiguracao derruba a subida se faltar algum).
app.email.habilitado=${EMAIL_HABILITADO:false}
app.email.remetente-nome=${MAIL_REMETENTE_NOME:Kelly Academy}
# Base dos links enviados por e-mail (ex.: https://app.kellyacademy.com.br), sem barra no final
app.frontend-url=${APP_FRONTEND_URL:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
# Gmail: senha de app (16 caracteres), nunca a senha da conta
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Timeouts em ms: SMTP lento não pode segurar thread indefinidamente
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

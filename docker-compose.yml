# Backend + PostgreSQL. Todos os valores vêm do arquivo .env (copie de .env.example e preencha tudo).
# Subir:   docker compose up -d --build
# Logs:    docker compose logs -f api
# Parar:   docker compose down          (os dados ficam no volume pgdata)
name: studymind-redacao

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Preso ao 127.0.0.1: o banco não fica exposto para a rede (acesse por túnel SSH na VPS)
    ports:
      - "127.0.0.1:${DB_PORTA_HOST}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGENS: ${CORS_ORIGENS}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO}
      CADASTRO_EMAILS_PERMITIDOS: ${CADASTRO_EMAILS_PERMITIDOS}
      LIMITE_CORRECOES_DIARIAS: ${LIMITE_CORRECOES_DIARIAS}
      LIMITE_CORRECOES_GLOBAL: ${LIMITE_CORRECOES_GLOBAL}
      LIMITE_TRANSCRICOES_DIARIAS: ${LIMITE_TRANSCRICOES_DIARIAS}
      LIMITE_TRANSCRICOES_GLOBAL: ${LIMITE_TRANSCRICOES_GLOBAL}
      GEMINI_MODELO_TRANSCRICAO: ${GEMINI_MODELO_TRANSCRICAO}
      EMAIL_HABILITADO: ${EMAIL_HABILITADO}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_REMETENTE_NOME: ${MAIL_REMETENTE_NOME}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      FORWARD_HEADERS: ${FORWARD_HEADERS}
      TZ: ${TZ}
    # API_BIND=127.0.0.1 quando houver proxy com HTTPS na frente; 0.0.0.0 para acesso direto pela porta
    ports:
      - "${API_BIND}:${API_PORTA_HOST}:8080"
    # Uma correção pode levar até ~140 s: dá tempo de terminar antes do container ser morto no stop/deploy
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  pgdata:

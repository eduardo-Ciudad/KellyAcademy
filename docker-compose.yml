
name: studymind-redacao

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORTA_HOST}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGENS: ${CORS_ORIGENS}
      CADASTRO_ABERTO: ${CADASTRO_ABERTO}
      CADASTRO_EMAILS_PERMITIDOS: ${CADASTRO_EMAILS_PERMITIDOS}
      LIMITE_CORRECOES_DIARIAS: ${LIMITE_CORRECOES_DIARIAS}
      LIMITE_CORRECOES_GLOBAL: ${LIMITE_CORRECOES_GLOBAL}
      LIMITE_TRANSCRICOES_DIARIAS: ${LIMITE_TRANSCRICOES_DIARIAS}
      LIMITE_TRANSCRICOES_GLOBAL: ${LIMITE_TRANSCRICOES_GLOBAL}
      GEMINI_MODELO_TRANSCRICAO: ${GEMINI_MODELO_TRANSCRICAO}
      GEMINI_MODELO_AVALIACAO: ${GEMINI_MODELO_AVALIACAO:-gemini-3.5-flash-lite}
      GEMINI_RACIOCINIO_AVALIACAO: ${GEMINI_RACIOCINIO_AVALIACAO:-medium}
      GEMINI_TIMEOUT_SEGUNDOS: ${GEMINI_TIMEOUT_SEGUNDOS:-60}
      EMAIL_HABILITADO: ${EMAIL_HABILITADO}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_REMETENTE_NOME: ${MAIL_REMETENTE_NOME}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      FORWARD_HEADERS: ${FORWARD_HEADERS}
      PAGAMENTO_HABILITADO: ${PAGAMENTO_HABILITADO}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRECO_PRO_MENSAL: ${STRIPE_PRECO_PRO_MENSAL}
      STRIPE_PRECO_PRO_ANUAL: ${STRIPE_PRECO_PRO_ANUAL}
      STRIPE_LOGO_FILE: ${STRIPE_LOGO_FILE}
      JULIA_GEMINI_API_KEY: ${JULIA_GEMINI_API_KEY}
      JULIA_GEMINI_MODELO: ${JULIA_GEMINI_MODELO:-gemini-3.5-flash-lite}
      JULIA_GEMINI_RACIOCINIO: ${JULIA_GEMINI_RACIOCINIO:-low}
      TZ: ${TZ}
    ports:
      - "${API_BIND}:${API_PORTA_HOST}:8080"
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  pgdata:
